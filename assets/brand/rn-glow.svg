<stop offset="0" stop-color="#5a9aee"/><stop offset=".5" stop-color="#47abe1"/><stop offset="1" stop-color="#3fd0e9"/>
</linearGradient>
<linearGradient id="accV" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#5a9aee" stop-opacity=".55"/><stop offset="1" stop-color="#3fd0e9"/>
</linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#04101d" stop-opacity="0"/><stop offset="1" stop-color="#04101d" stop-opacity=".85"/>
</linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#3fd0e9" stop-opacity=".5"/><stop offset="1" stop-color="#3fd0e9" stop-opacity="0"/>
</radialGradient>
<radialGradient id="g1" cx=".5" cy=".5" r=".5">
