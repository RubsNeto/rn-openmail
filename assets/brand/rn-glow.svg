<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2068 900" width="2068" height="900" fill="none">
<style>
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:rnd 1.5s .25s cubic-bezier(.4,0,.2,1) forwards}
.br{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.05);animation:rng .85s cubic-bezier(.22,1,.36,1) forwards}
.pt{transform-box:fill-box;transform-origin:center;animation:rnp 2.8s 1.7s ease-in-out infinite}
@keyframes rnd{to{stroke-dashoffset:0}}
@keyframes rng{to{transform:scaleY(1)}}
@keyframes rnp{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.br{animation:none;transform:none}.pt{animation:none}}
</style>
<defs>
